; M5 StopWatch 着せ替え時計
; 公式ドキュメントの PlatformIO 設定をベースにしています。
; ライブラリは動作確認(ビルド)に使った版に固定しています。JS エンジン(QuickJS)は lib/quickjs に同梱。
[env:m5stack-stopwatch]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    M5Unified = https://github.com/m5stack/M5Unified#96576a14247ddc935149145aa6b51943464120f1
    M5GFX = https://github.com/m5stack/M5GFX#28d47949bdc84f30881623476f555398e2194313
    h2zero/NimBLE-Arduino @ 2.5.2
